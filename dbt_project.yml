name: 'tracksuit_take_home'
version: '1.0.0'
config-version: 2

profile: 'tracksuit_take_home'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# staging  -> 1:1 cleanup/typing of raw sources, no business logic
# intermediate -> purpose-built transforms (entity resolution, renewal-chain
#                 collapsing, monthly revenue) that only exist to feed marts
# marts/core -> the reusable dimensional model (dim_customers, fct_subscriptions,
#               fct_customer_month) — the actual deliverable
# marts/reporting -> the GRR reporting model built on top of marts/core
models:
  tracksuit_take_home:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
